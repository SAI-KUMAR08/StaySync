# Railway config-as-code — long-running backend service.
# Create the Railway service from this GitHub repo with Root Directory = server.
# Railpack (Railway's default builder) auto-detects Node.js and installs dependencies.
# Config is read from the repo path server/railway.toml (the service's root directory).
#
# The frontend stays on Vercel (static SPA) and calls this service via VITE_API_URL.

[build]
builder = "RAILPACK"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
